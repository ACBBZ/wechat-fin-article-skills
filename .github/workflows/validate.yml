name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate Agent Skills
        run: |
          for skill in fin-article-writer fin-writing-style wechat-cover-generator wechat-draft-uploader; do
            uvx \
              --from "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" \
              skills-ref validate "$skill"
          done

      - name: Test article writer
        run: uv run --with pytest pytest -q fin-article-writer/tests

      - name: Test draft uploader
        run: uv run --project wechat-draft-uploader pytest -q wechat-draft-uploader/tests
