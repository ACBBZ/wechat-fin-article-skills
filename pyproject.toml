[project]
name = "wechat-draft-uploader"
version = "0.2.0"
description = "将本地 Markdown 转换为微信公众号图文并上传到草稿箱的 Agent Skill。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0.0",
]

[project.scripts]
wechat-draft-uploader = "wechat_draft_uploader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_draft_uploader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
